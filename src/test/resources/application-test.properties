# ==================================================
# CONFIGURAÇÕES DO AMBIENTE DE TESTES DE INTEGRAÇÃO
# ==================================================

# define o banco de dados exclusivo para os testes
spring.datasource.url=jdbc:mysql://localhost:3306/raizes_nordeste_test

# define o usuario exclusivo do banco de testes
spring.datasource.username=raizes_test

# obtem a senha por meio de uma variavel de ambiente
spring.datasource.password=${RAIZES_TEST_DB_PASSWORD}

# garante que o Hibernate apenas valide a estrutura do banco
spring.jpa.hibernate.ddl-auto=validate

# habilita a execução das migrations pelo Flyway
spring.flyway.enabled=true

# garante que o Flyway utilize o banco e as credenciais de testes
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# impede a execução acidental do comando clean do Flyway
spring.flyway.clean-disabled=true

# desabilita a criação automatica do administrador
app.bootstrap.admin.enabled=false

# ==========================================
# CONFIGURAÇÕES JWT EXCLUSIVAS PARA TESTES
# ==========================================

# define um emissor exclusivo para os tokens de teste
app.jwt.issuer=raizes-nordeste-test

# recupera a chave secreta exclusiva do ambiente de testes
app.jwt.secret=${RAIZES_TEST_JWT_SECRET}

# define a validade dos tokens de teste em segundos
app.jwt.expiration=3600

# ==========================================
# CONFIGURAÇÕES DE CONSENTIMENTO LGPD
# ==========================================

# versão vigente do termo de consentimento para marketing
app.lgpd.termo.marketing.versao=1.0

# versão vigente do termo de consentimento para fidelidade
app.lgpd.termo.fidelidade.versao=1.0