# define o nome da aplicação
spring.application.name=RaizesNordeste

# desabilita o Open Session in View
spring.jpa.open-in-view=false

# ==========================================
# CONFIGURAÇÕES DE AUTENTICAÇÃO JWT
# ==========================================

# identifica a aplicação emissora dos tokens
app.jwt.issuer=raizes-nordeste

# recupera a chave secreta de uma variavel de ambiente
app.jwt.secret=${RAIZES_JWT_SECRET}

# define o tempo de validade do token em segundos
app.jwt.expiration=3600

# ==========================================
# CONFIGURAÇÕES DE CONSENTIMENTO LGPD
# ==========================================

# versao vigente do termo de consentimento para marketing
app.lgpd.termo.marketing.versao=1.0

# versao vigente do termo de consentimento para fidelidade
app.lgpd.termo.fidelidade.versao=1.0

#---
# ativa as configurações locais somente fora do perfil de testes
spring.config.activate.on-profile=!test

# importa as configurações privadas de desenvolvimento
spring.config.import=optional:file:./application-local.properties