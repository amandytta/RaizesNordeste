# define o nome da aplicacao
spring.application.name=RaizesNordeste

# desabilita o Open Session in View
spring.jpa.open-in-view=false

# ativa as configuracoes locais somente fora do perfil de testes
spring.config.activate.on-profile=!test

# importa as configuracoes privadas de desenvolvimento
spring.config.import=optional:file:./application-local.properties